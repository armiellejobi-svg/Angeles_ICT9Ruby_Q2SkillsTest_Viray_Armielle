<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OBMC Enroll Now</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
    body {
        font-family: Arial, sans-serif;
    }

    h1, h2 {
        color: white;
    }

    .navbar-brand {
        font-weight: bold;
    }

    .enrollment {
        background-color: lightgray;
        padding: 25px;
        border-radius: 5px;
    }

    .footer {
        background-color: navy;
        color: white;
        padding: 10px;
    }

    .background {
        background-image: url("obmcbgv.jpg");
        background-size: cover;
        background-position: center;
    }
</style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="#home">
                <img src="oblogo.png" width="30" alt="OBMC Logo">
                Enroll Now
            </a>

            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search">
                <button class="btn btn-primary" type="submit">Search</button>
            </form>

        </div>
    </nav>

    <div id="home" class="background">

        <div class="container py-4">

            <div class="text-center">
                <h1>OBMC Student Enrollment Form</h1>
                <p class="text-white">Fill out the form below to enroll for the upcoming school year.</p>
            </div>

            <div class="container mt-4 mb-4">

                <div class="enrollment">

                    <h2>Student Information</h2>

                    <form>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" placeholder="John">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" placeholder="Doe">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Birth Date</label>
                                <input type="date" class="form-control">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Gender</label>
                                <select class="form-select">
                                    <option selected disabled>Select...</option>
                                    <option>Male</option>
                                    <option>Female</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Grade Level</label>
                                <select class="form-select">
                                    <option selected disabled>Select...</option>
                                    <option>Grade 7</option>
                                    <option>Grade 8</option>
                                    <option>Grade 9</option>
                                    <option>Grade 10</option>
                                    <option>Grade 11</option>
                                    <option>Grade 12</option>
                                </select>
                            </div>

                        </div>

                        <h2>Contact Details</h2>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="student@example.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contact Number</label>
                            <input type="text" class="form-control" placeholder="0912-345-6789">
                        </div>

                        <h2>Other Information</h2>

                        <label class="form-label">Mode of Learning</label>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="mode">
                            <label class="form-check-label">Online</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="mode">
                            <label class="form-check-label">Face-to-Face</label>
                        </div>

                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">
                                I confirm that the information provided is true and complete.
                            </label>
                        </div>

                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-primary">
                                Submit Enrollment
                            </button>
                        </div>

                    </form>

                </div>

            </div>

            <div class="footer text-center">
                 2026 Student Enrollment Page | Armielle Viray | Ruby
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
